# TokenLock (and everything that imports it, which compiles together with it) is built for `paris`, so it
# runs on chains that lack PUSH0 / MCOPY. Everything else is built for `cancun`, and `evm_version` is also the
# EVM forge runs tests and script simulations on: at `cancun` the deploy script can simulate a token that was
# itself compiled for a newer EVM, which the constructor's `balanceOf` probe calls into. Do not raise the
# TokenLock pin without proving the target chain supports the newer opcodes.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
additional_compiler_profiles = [{ name = "paris", evm_version = "paris" }]
compilation_restrictions = [{ paths = "src/TokenLock.sol", evm_version = "paris" }]
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Off so an incremental build recompiles everything that embeds TokenLock's bytecode: with it on, a change
# to src/ recompiles TokenLock alone and script/DeployTokenLock.s.sol keeps deploying the previous build.
# It is a build-pipeline switch only; TokenLock's bytecode is the same either way.
dynamic_test_linking = false

[fuzz]
runs = 256

